<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 455" role="img" aria-labelledby="title desc"><title id="title">Move ownership, then borrow</title><desc id="desc">Before a move, a owns the String allocation. After the move, b owns the same allocation and a is unavailable. A shared reference borrows b.</desc><style>text{font-family:Arial,sans-serif;fill:#172d40;font-size:21px}.heading{font-size:25px;font-weight:bold}.small{font-size:18px}.box{fill:#e5eff7;stroke:#285878;stroke-width:2}.borrow{fill:#e3f3ed;stroke:#27654d;stroke-width:2;stroke-dasharray:7 4}.changed{fill:#fff0cd;stroke:#79540d;stroke-width:2}.arrow{fill:none;stroke:#172d40;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172d40"/></marker></defs><rect width="720" height="455" rx="12" fill="#faf8f3"/><text x="28" y="40" class="heading">Before move</text><rect x="30" y="70" width="180" height="60" rx="8" class="box"/><text x="44" y="107.0" class="">a: String</text><path d="M220 100 L420 100" class="arrow"/><rect x="440" y="70" width="250" height="60" rx="8" class="box"/><text x="454" y="107.0" class="">allocation: Rust</text><text x="270" y="85" class="small">owns</text><text x="28" y="185" class="heading">After: let b = a</text><rect x="30" y="210" width="180" height="60" rx="8" class="box"/><text x="44" y="247.0" class="">b: String</text><path d="M220 240 L420 240" class="arrow"/><rect x="440" y="210" width="250" height="60" rx="8" class="box"/><text x="454" y="247.0" class="">same allocation</text><text x="30" y="305" class="">a is unavailable; the text was not duplicated.</text><rect x="30" y="335" width="180" height="55" rx="8" class="borrow"/><text x="44" y="369.5" class="">r = &amp;b</text><path d="M30 360 L15 360 L15 240 L30 240" class="arrow"/><text x="280" y="360" class="small">shared access</text><text x="30" y="425" class="">Solid = owner; dashed = borrow. Conceptual layout.</text></svg>