<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc"><title id="title">Upload compute download</title><desc id="desc">Inputs begin in host memory, are uploaded to device buffers, processed by a kernel, and downloaded only after completion.</desc><style>text{font-family:Arial,sans-serif;fill:#172d40;font-size:21px}.heading{font-size:25px;font-weight:bold}.small{font-size:18px}.box{fill:#e5eff7;stroke:#285878;stroke-width:2}.borrow{fill:#e3f3ed;stroke:#27654d;stroke-width:2;stroke-dasharray:7 4}.changed{fill:#fff0cd;stroke:#79540d;stroke-width:2}.arrow{fill:none;stroke:#172d40;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172d40"/></marker></defs><rect width="720" height="500" rx="12" fill="#faf8f3"/><text x="28" y="40" class="heading">Host and device are separate locations</text><text x="35" y="85" class="heading">HOST (CPU)</text><text x="405" y="85" class="heading">DEVICE (GPU)</text><rect x="30" y="110" width="260" height="60" rx="8" class="box"/><text x="44" y="147.0" class="">a, b: input arrays</text><path d="M300 140 L390 140" class="arrow"/><rect x="405" y="110" width="285" height="60" rx="8" class="box"/><text x="419" y="147.0" class="">device input buffers</text><text x="305" y="125" class="small">upload</text><path d="M550 180 L550 235" class="arrow"/><rect x="405" y="245" width="285" height="60" rx="8" class="box"/><text x="419" y="282.0" class="">kernel â†’ output</text><text x="30" y="225" class="">Buffers stay valid while</text><text x="30" y="255" class="">queued GPU work runs.</text><rect x="30" y="350" width="260" height="60" rx="8" class="changed"/><text x="44" y="387.0" class="">c: host result</text><path d="M390 380 L300 380" class="arrow"/><rect x="405" y="350" width="285" height="60" rx="8" class="changed"/><text x="419" y="387.0" class="">device output ready</text><text x="295" y="345" class="small">download</text><path d="M550 312 L550 343" class="arrow"/><text x="30" y="465" class="">Before reading on the CPU: establish completion.</text></svg>