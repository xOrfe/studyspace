<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 505" role="img" aria-labelledby="title desc"><title id="title">Six disjoint tensor tiles</title><desc id="desc">A four by six tensor is partitioned into two by two tiles, resulting in a two by three grid. Thick borders distinguish all six tiles without relying on color.</desc><style>text{font-family:Arial,sans-serif;fill:#172d40;font-size:21px}.heading{font-size:25px;font-weight:bold}.small{font-size:18px}.box{fill:#e5eff7;stroke:#285878;stroke-width:2}.borrow{fill:#e3f3ed;stroke:#27654d;stroke-width:2;stroke-dasharray:7 4}.changed{fill:#fff0cd;stroke:#79540d;stroke-width:2}.arrow{fill:none;stroke:#172d40;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172d40"/></marker></defs><rect width="720" height="505" rx="12" fill="#faf8f3"/><text x="28" y="40" class="heading">Tensor [4, 6] → tiles [2, 2]</text><rect x="110" y="85" width="80" height="64" fill="#e5eff7" stroke="#607080"/><text x="128" y="124" class="small">0,0</text><rect x="192" y="85" width="80" height="64" fill="#e5eff7" stroke="#607080"/><text x="210" y="124" class="small">0,1</text><rect x="274" y="85" width="80" height="64" fill="#e3f3ed" stroke="#607080"/><text x="292" y="124" class="small">0,2</text><rect x="356" y="85" width="80" height="64" fill="#e3f3ed" stroke="#607080"/><text x="374" y="124" class="small">0,3</text><rect x="438" y="85" width="80" height="64" fill="#fff0cd" stroke="#607080"/><text x="456" y="124" class="small">0,4</text><rect x="520" y="85" width="80" height="64" fill="#fff0cd" stroke="#607080"/><text x="538" y="124" class="small">0,5</text><rect x="110" y="151" width="80" height="64" fill="#e5eff7" stroke="#607080"/><text x="128" y="190" class="small">1,0</text><rect x="192" y="151" width="80" height="64" fill="#e5eff7" stroke="#607080"/><text x="210" y="190" class="small">1,1</text><rect x="274" y="151" width="80" height="64" fill="#e3f3ed" stroke="#607080"/><text x="292" y="190" class="small">1,2</text><rect x="356" y="151" width="80" height="64" fill="#e3f3ed" stroke="#607080"/><text x="374" y="190" class="small">1,3</text><rect x="438" y="151" width="80" height="64" fill="#fff0cd" stroke="#607080"/><text x="456" y="190" class="small">1,4</text><rect x="520" y="151" width="80" height="64" fill="#fff0cd" stroke="#607080"/><text x="538" y="190" class="small">1,5</text><rect x="110" y="217" width="80" height="64" fill="#e3f3ed" stroke="#607080"/><text x="128" y="256" class="small">2,0</text><rect x="192" y="217" width="80" height="64" fill="#e3f3ed" stroke="#607080"/><text x="210" y="256" class="small">2,1</text><rect x="274" y="217" width="80" height="64" fill="#fff0cd" stroke="#607080"/><text x="292" y="256" class="small">2,2</text><rect x="356" y="217" width="80" height="64" fill="#fff0cd" stroke="#607080"/><text x="374" y="256" class="small">2,3</text><rect x="438" y="217" width="80" height="64" fill="#e5eff7" stroke="#607080"/><text x="456" y="256" class="small">2,4</text><rect x="520" y="217" width="80" height="64" fill="#e5eff7" stroke="#607080"/><text x="538" y="256" class="small">2,5</text><rect x="110" y="283" width="80" height="64" fill="#e3f3ed" stroke="#607080"/><text x="128" y="322" class="small">3,0</text><rect x="192" y="283" width="80" height="64" fill="#e3f3ed" stroke="#607080"/><text x="210" y="322" class="small">3,1</text><rect x="274" y="283" width="80" height="64" fill="#fff0cd" stroke="#607080"/><text x="292" y="322" class="small">3,2</text><rect x="356" y="283" width="80" height="64" fill="#fff0cd" stroke="#607080"/><text x="374" y="322" class="small">3,3</text><rect x="438" y="283" width="80" height="64" fill="#e5eff7" stroke="#607080"/><text x="456" y="322" class="small">3,4</text><rect x="520" y="283" width="80" height="64" fill="#e5eff7" stroke="#607080"/><text x="538" y="322" class="small">3,5</text><rect x="110" y="85" width="162" height="130" fill="none" stroke="#172d40" stroke-width="4"/><rect x="274" y="85" width="162" height="130" fill="none" stroke="#172d40" stroke-width="4"/><rect x="438" y="85" width="162" height="130" fill="none" stroke="#172d40" stroke-width="4"/><rect x="110" y="217" width="162" height="130" fill="none" stroke="#172d40" stroke-width="4"/><rect x="274" y="217" width="162" height="130" fill="none" stroke="#172d40" stroke-width="4"/><rect x="438" y="217" width="162" height="130" fill="none" stroke="#172d40" stroke-width="4"/><text x="30" y="390" class="">Thick borders = six disjoint output regions.</text><text x="30" y="430" class="">Each region contains 2 rows × 2 columns.</text><text x="30" y="470" class="">Cells are labeled row,column; grid shape is [2, 3].</text></svg>