<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">Mutation versus shadowing</title><desc id="desc">Mutation updates the value of one binding. Shadowing introduces another binding, possibly with another type.</desc><style>text{font-family:Arial,sans-serif;fill:#172d40;font-size:21px}.heading{font-size:25px;font-weight:bold}.small{font-size:18px}.box{fill:#e5eff7;stroke:#285878;stroke-width:2}.borrow{fill:#e3f3ed;stroke:#27654d;stroke-width:2;stroke-dasharray:7 4}.changed{fill:#fff0cd;stroke:#79540d;stroke-width:2}.arrow{fill:none;stroke:#172d40;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172d40"/></marker></defs><rect width="720" height="430" rx="12" fill="#faf8f3"/><text x="28" y="40" class="heading">Mutation: the same binding</text><rect x="30" y="70" width="220" height="65" rx="8" class="box"/><text x="44" y="109.5" class="">count: i32 = 2</text><path d="M270 102 L420 102" class="arrow"/><rect x="440" y="70" width="250" height="65" rx="8" class="changed"/><text x="454" y="109.5" class="">count: i32 = 3</text><text x="285" y="88" class="small">+= 1</text><text x="28" y="200" class="heading">Shadowing: a new binding</text><rect x="30" y="230" width="220" height="65" rx="8" class="box"/><text x="44" y="269.5" class="">count: i32 = 3</text><path d="M270 262 L420 262" class="arrow"/><rect x="440" y="230" width="250" height="65" rx="8" class="changed"/><text x="454" y="269.5" class="">count: String = &quot;3&quot;</text><text x="280" y="246" class="small">let count</text><text x="30" y="350" class="">Solid blue = original; amber = updated or new.</text><text x="30" y="385" class="">mut keeps the type. A new let can change it.</text></svg>