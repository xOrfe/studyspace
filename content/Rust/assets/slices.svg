<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 445" role="img" aria-labelledby="title desc"><title id="title">A slice borrows a window</title><desc id="desc">Six array cells are indexed zero through five. The slice from one to four borrows values twenty, thirty, and forty and carries a pointer and length.</desc><style>text{font-family:Arial,sans-serif;fill:#172d40;font-size:21px}.heading{font-size:25px;font-weight:bold}.small{font-size:18px}.box{fill:#e5eff7;stroke:#285878;stroke-width:2}.borrow{fill:#e3f3ed;stroke:#27654d;stroke-width:2;stroke-dasharray:7 4}.changed{fill:#fff0cd;stroke:#79540d;stroke-width:2}.arrow{fill:none;stroke:#172d40;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172d40"/></marker></defs><rect width="720" height="445" rx="12" fill="#faf8f3"/><text x="28" y="40" class="heading">Array: [10, 20, 30, 40, 50, 60]</text><text x="55" y="85" class="small">0</text><rect x="30" y="100" width="98" height="65" rx="8" class="box"/><text x="44" y="139.5" class="">10</text><text x="165" y="85" class="small">1</text><rect x="140" y="100" width="98" height="65" rx="8" class="borrow"/><text x="154" y="139.5" class="">20</text><text x="275" y="85" class="small">2</text><rect x="250" y="100" width="98" height="65" rx="8" class="borrow"/><text x="264" y="139.5" class="">30</text><text x="385" y="85" class="small">3</text><rect x="360" y="100" width="98" height="65" rx="8" class="borrow"/><text x="374" y="139.5" class="">40</text><text x="495" y="85" class="small">4</text><rect x="470" y="100" width="98" height="65" rx="8" class="box"/><text x="484" y="139.5" class="">50</text><text x="605" y="85" class="small">5</text><rect x="580" y="100" width="98" height="65" rx="8" class="box"/><text x="594" y="139.5" class="">60</text><text x="30" y="225" class="heading">&amp;values[1..4] → [20, 30, 40]</text><text x="30" y="270" class="">Start 1 included; end 4 excluded.</text><rect x="30" y="305" width="285" height="60" rx="8" class="borrow"/><text x="44" y="342.0" class="">pointer to values[1]</text><rect x="350" y="305" width="285" height="60" rx="8" class="borrow"/><text x="364" y="342.0" class="">length = 3</text><text x="30" y="410" class="">Dashed cells = borrowed window; no element copy.</text></svg>